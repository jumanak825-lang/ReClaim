# Local development services for Reclaim.
#   docker compose up -d db
# Postgres is published on 5433 so it doesn't clash with a local Postgres on 5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reclaim
      POSTGRES_PASSWORD: reclaim
      POSTGRES_DB: reclaim
    ports:
      - "5433:5432"
    volumes:
      - reclaim-db:/var/lib/postgresql/data
      - ./apps/api/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reclaim -d reclaim"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  reclaim-db:
